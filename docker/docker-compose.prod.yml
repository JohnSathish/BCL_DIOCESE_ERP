# Production compose overlay — DEDICATED server only (binds 80/443).
# On a SHARED Hostinger VPS (College ERP / Dosa already running), use instead:
#   docker compose -f docker/docker-compose.hostinger.yml --env-file .env.production up -d --build
# See docs/HOSTINGER_VPS.md

services:
  api:
    environment:
      NODE_ENV: production
      SEED_ON_START: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      API_PORT: 4000
      API_URL: ${API_URL:-https://api.turadiocese.in}
      WEB_URL: ${WEB_URL:-https://erp.turadiocese.in}
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      DIOCESE_PUBLIC_BASE_DOMAIN: ${DIOCESE_PUBLIC_BASE_DOMAIN:-turadiocese.in}
      PRISMA_SCHEMA_PUSH: ${PRISMA_SCHEMA_PUSH:-true}
    restart: unless-stopped

  web:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.turadiocese.in/api/v1}
      NEXT_PUBLIC_DIOCESE_PRIMARY_DOMAIN: ${NEXT_PUBLIC_DIOCESE_PRIMARY_DOMAIN:-turadiocese.in}
      CMS_RESOLVE_API_URL: http://api:4000/api/v1
    restart: unless-stopped

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
