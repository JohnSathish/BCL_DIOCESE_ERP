# Public diocese website (apex) + parish subdomains (*.turadiocese.in)
# Wildcard cert required for parish subdomains.
server {
  listen 80;
  # listen 443 ssl http2;
  server_name turadiocese.in www.turadiocese.in *.turadiocese.in;

  # ssl_certificate     /etc/letsencrypt/live/turadiocese.in/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/turadiocese.in/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy $csp_header always;

  if ($host = www.turadiocese.in) {
    return 301 https://turadiocese.in$request_uri;
  }

  # Reserved ERP/API/media labels are handled in dedicated server blocks below.
  # Parish hosts (e.g. sacredheart.turadiocese.in) hit Next; middleware resolves → /site/{slug}.

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Custom parish domains (example: Sacred Heart) — same multi-tenant web app
server {
  listen 80;
  # listen 443 ssl http2;
  server_name sacredheartshrinetura.in www.sacredheartshrinetura.in;

  # ssl_certificate     /etc/letsencrypt/live/sacredheartshrinetura.in/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/sacredheartshrinetura.in/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  if ($host = www.sacredheartshrinetura.in) {
    return 301 https://sacredheartshrinetura.in$request_uri;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Diocese ERP console
server {
  listen 80;
  # listen 443 ssl http2;
  server_name erp.turadiocese.in;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Central API
server {
  listen 80;
  # listen 443 ssl http2;
  server_name api.turadiocese.in;

  client_max_body_size 50m;

  location / {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Central media (object storage / CDN origin or R2 public bucket via reverse proxy)
server {
  listen 80;
  # listen 443 ssl http2;
  server_name media.turadiocese.in;

  location / {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
