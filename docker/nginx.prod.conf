# Diocese-centric multi-parish hosts (Roman Catholic Diocese of Tura)
# Primary: turadiocese.in — parish sites via subdomain or custom domain
# Terminate TLS with certbot / cloud LB. Replace certificate paths before go-live.

upstream api_upstream {
  server api:4000;
}

upstream web_upstream {
  server web:3000;
}

map $sent_http_content_type $csp_header {
  default "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.turadiocese.in; frame-ancestors 'none';";
}

