services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bcl
      POSTGRES_PASSWORD: bclsecret
      POSTGRES_DB: bcl_enterprise
    ports:
      - "5433:5432"
    volumes:
      - bcl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcl -d bcl_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://bcl:bclsecret@postgres:5432/bcl_enterprise?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars!!
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars!
      API_PORT: 4000
      WEB_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      SEED_SUPER_ADMIN_EMAIL: admin@basecodelabs.com
      SEED_SUPER_ADMIN_PASSWORD: Admin@12345
    ports:
      - "4000:4000"
    volumes:
      - bcl_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  bcl_pg:
  bcl_uploads:
