# Use this file INSIDE nep-erp-nginx (NOT host nginx).
# Proxy targets use the Docker bridge gateway so the nginx container
# can reach BCL ports published on the VPS host (13100 / 14100).
#
# If 172.17.0.1 does not work on your host, run:
#   ip -4 addr show docker0
# and replace 172.17.0.1 with that gateway IP.

upstream bcl_diocese_web {
  server 172.17.0.1:13100;
  keepalive 32;
}

upstream bcl_diocese_api {
  server 172.17.0.1:14100;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name sacredheartshrinetura.in www.sacredheartshrinetura.in;
  client_max_body_size 40m;

  location / {
    proxy_pass http://bcl_diocese_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name turadiocese.in www.turadiocese.in sacredheart.turadiocese.in;
