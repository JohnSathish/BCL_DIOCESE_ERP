# BCL Diocese ERP — add to nep-erp-nginx (same pattern as Mercy Dosa House).
# Proxy via Docker bridge gateway → host-published BCL ports.
# Do NOT replace College ERP / Moodle / Dosa server blocks.

upstream bcl_diocese_web { server 172.17.0.1:13100; }
upstream bcl_diocese_api { server 172.17.0.1:14100; }

# ── Sacred Heart parish (custom domain) ──
server {
  listen 80;
  server_name sacredheartshrinetura.in www.sacredheartshrinetura.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / {
    proxy_pass http://bcl_diocese_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ── Diocese apex + parish subdomain ──
server {
  listen 80;
  server_name turadiocese.in www.turadiocese.in sacredheart.turadiocese.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / {
    proxy_pass http://bcl_diocese_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ── ERP console ──
server {
  listen 80;
  server_name erp.turadiocese.in erp.sacredheartshrinetura.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / {
    proxy_pass http://bcl_diocese_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ── Central API ──
server {
  listen 80;
  client_max_body_size 50m;
  server_name api.turadiocese.in api.sacredheartshrinetura.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / {
    proxy_pass http://bcl_diocese_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
