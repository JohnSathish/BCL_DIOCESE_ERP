# Copy to /etc/nginx/sites-available/ (or Hostinger equivalent) and symlink into sites-enabled.
# Proxies to BCL Diocese Docker stack on localhost (does not replace other vhosts).
#
# After install:
#   sudo ln -s /etc/nginx/sites-available/bcl-diocese.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d turadiocese.in -d www.turadiocese.in \
#     -d erp.turadiocese.in -d api.turadiocese.in \
#     -d sacredheart.turadiocese.in \
#     -d sacredheartshrinetura.in -d www.sacredheartshrinetura.in
#
# If you use Cloudflare SSL "Full", keep HTTP first then enable 443 blocks.

upstream bcl_diocese_web {
  server 127.0.0.1:13100;
  keepalive 32;
}

upstream bcl_diocese_api {
  server 127.0.0.1:14100;
  keepalive 32;
}

# ——— Public parish: sacredheartshrinetura.in ———
server {
  listen 80;
  listen [::]:80;
  server_name sacredheartshrinetura.in www.sacredheartshrinetura.in;

  client_max_body_size 40m;

  location / {
    proxy_pass http://bcl_diocese_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

